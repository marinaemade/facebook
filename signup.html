<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container shadow-lg rounded mt-5 w-75">
        <div class="row ">
            <div class="bg-primary text-light text-center py-2">
                <h1>Create Account</h1>
            </div>
            <div class="bg-white p-4">
                <form onsubmit="return validateForm()" action="home.html">
                    <div class="row">
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="firstNameLabel form-label text-primary fw-bold">First Name :</label>
                            <input type="text" class="form-control firstNameInput" placeholder="Enter your first name">
                        </div>
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="lastNameLabel form-label text-primary fw-bold">Last Name :</label>
                            <input type="text" class="form-control lastNameInput" placeholder="Enter your last name">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="emailLabel form-label text-primary fw-bold">Email:</label>
                            <input type="email" class="form-control emailInput" placeholder="Enter your email">
                        </div>
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="phoneLabel form-label text-primary fw-bold">Phone Number :</label>
                            <input type="text" class="phoneInput form-control" placeholder="Enter your phone number">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="passLabel form-label text-primary fw-bold">Password :</label>
                            <input type="password" class="passInput form-control" placeholder="Enter your password">
                        </div>
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="confirmPassLabel form-label text-primary fw-bold">Confirm Password :</label>
                            <input type="password" class="confirmPassInput form-control" placeholder="Confirm your password">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="genderLabel form-label text-primary fw-bold">Gender :</label>
                            <div class="form-check">
                                <input class="maleCheck form-check-input" type="radio" name="radioDefault">
                                <label class="form-check-label" for="radioDefault1">
                                    Male
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="femaleCheck form-check-input" type="radio" name="radioDefault">
                                <label class="form-check-label" for="radioDefault1">
                                    Female
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="dateLabel form-label text-primary fw-bold">Birthdate :</label>
                            <input type="date" class="dateInput form-control" id="birthdate" name="birthdate">
                        </div>
                    </div>
                    <div class="col-md-6 my-3">
                        <input class="btn btn-primary" type="reset" value="Reset">
                        <input class="btn btn-primary" type="submit" value="Register">
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="bootstrap/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>
