<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container shadow-lg rounded mt-5 w-75">
        <div class="row ">
            <div class="bg-primary text-light text-center py-2">
                <h1>Create Account</h1>
            </div>
            <div class="bg-white p-4">
                <form action="">
                    <div class="row">
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="form-label text-primary fw-bold">First Name :</label>
                            <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Enter your first name">
                        </div>
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="form-label text-primary fw-bold">Last Name :</label>
                            <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Enter your last name">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="form-label text-primary fw-bold">Email:</label>
                            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Enter your email">
                        </div>
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="form-label text-primary fw-bold">Phone Number :</label>
                            <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Enter your phone number">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="form-label text-primary fw-bold">Password :</label>
                            <input type="password" class="form-control" id="exampleFormControlInput1" placeholder="Enter your password">
                        </div>
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="form-label text-primary fw-bold">Confirm Password :</label>
                            <input type="password" class="form-control" id="exampleFormControlInput1" placeholder="Confirm your password">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="form-label text-primary fw-bold">Gender :</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                                <label class="form-check-label" for="radioDefault1">
                                    Male
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                                <label class="form-check-label" for="radioDefault1">
                                    Female
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6 my-3">
                            <label for="exampleFormControlInput1" class="form-label text-primary fw-bold">Birthdate :</label>
                            <input type="date" class="form-control" id="birthdate" name="birthdate">
                        </div>
                    </div>
                    <div class="col-md-6 my-3">
                        <input class="btn btn-primary" type="reset" value="Reset">
                        <input class="btn btn-primary" type="submit" value="Register">
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="bootstrap/bootstrap.bundle.min.js"></script>
</body>
