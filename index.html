<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="row align-items-center"style="min-height: 100vh;">
            <div class="col-md-6">
                <h1 class="text-primary fw-bold mb-3">Facebook</h1>
                <p class="fs-4">Connect with friends and the world around you on Facebok</p>
            </div>
            <div class="col-md-6">
                <div class="card w-100">
                    <div class="card-body shadow-lg bg-body-tertiary rounded p-4">
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email address or phone number">
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" placeholder="Password">
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input border-dark" type="checkbox" value="" id="checkDefault">
                            <label class="form-check-label text-primary fs-6 fw-bold" for="checkDefault">
                                Show password
                            </label>
                        </div>
                        <div class="d-grid">
                            <a href="#" class="btn btn-primary ">Login</a>
                        </div>
                        <div class="text-center">
                            <p class="mt-4 text-primary">Forget Password?</p>
                            <hr>
                            <button type="button" class="btn btn-success mt-2" onclick="window.location.href='signup.html'">Create New Account</button>
                        </div>
                        
                    </div>
                </div>
                <p class="mt-3"><span class="text-primary">Create a page</span> for a celebrity, brand or business.</p>
            </div>
        </div>
    </div>

    <script src="bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
